name: Cleanup PR Docs

on:
  pull_request:
    types: [closed]
    paths:
      - 'docs/**'

jobs:
  cleanup-pr-docs:
    if: github.event.pull_request.merged == true
    runs-on: sofiagharunner
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.GHA_RUNNER_PRIVATE_KEY }}
        run: |
          echo "${DEPLOY_KEY}" > ~/.ssh/id_rsa_deploy_sdcwww
          chmod 600 ~/.ssh/id_rsa_deploy_sdcwww
      - name: Cleanup PR docs via rsync
        env:
          DEPLOY_HOST: ${{ secrets.SOFIA_REDUX_DOC_HOST }}
          DEPLOY_USER: ${{ secrets.GHA_RUNNER_USER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p empty_dir
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa_deploy_sdcwww -o StrictHostKeyChecking=yes" \
            empty_dir/ "gha-runner@${DEPLOY_HOST}:pr-${PR_NUMBER}/"